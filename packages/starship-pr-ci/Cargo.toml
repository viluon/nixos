[package]
name = "starship-pr-ci"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "starship-pr-ci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atomicwrites = "0.4"
clap = { version = "4", features = ["derive"] }
nanoserde = { version = "0.2", default-features = false, features = ["std", "json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
