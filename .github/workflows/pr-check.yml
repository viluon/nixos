# see https://github.com/EdenEast/nyx/blob/718063918f0ffe36ca1e049b222d5a5d3e939025/.github/workflows/pr.yml

name: pr

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  hosts:
    runs-on: ubuntu-26.04
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: list hosts
        id: list
        run: echo "hosts=$(ls denix/hosts | jq --raw-input --null-input --compact-output '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    needs: hosts
    name: build/${{ matrix.host }}
    runs-on: ubuntu-26.04
    concurrency:
      group: pr-${{ github.event.pull_request.number }}-${{ matrix.host }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    env:
      output: nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
    steps:
      - name: create nix mount point
        run: sudo mkdir /nix

      - name: maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /nix
          overprovision-lvm: true
          remove-android: true
          remove-codeql: true
          remove-docker-images: true
          remove-dotnet: true
          remove-haskell: true
          root-reserve-mb: 512
          swap-size-mb: 1024

      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}

      - name: compute push filter
        id: push-filter
        env:
          HEAD_TARGET: "github:${{ github.repository }}/${{ github.ref }}#${{ env.output }}"
          BASE_TARGET: "github:${{ github.repository }}/${{ github.base_ref }}#${{ env.output }}"
        run: |
          head_drv=$(nix eval --raw "$HEAD_TARGET.drvPath")
          base_drv=$(nix eval --raw "$BASE_TARGET.drvPath" || true)
          intellij_drvs=$(nix-store --query --requisites $head_drv $base_drv | grep -E -- '-intellij-idea-[0-9.]+\.drv$' || true)
          if [ -n "$intellij_drvs" ]; then
            uncached_drvs=$( { nix-store --query --referrers-closure $intellij_drvs; nix-store --query --references $intellij_drvs; } | grep '\.drv$' | sort -u)
            hashes=$(nix-store --query --outputs $uncached_drvs | sed -E 's|^/nix/store/([a-z0-9]{32})-.*|\1|' | paste -sd'|')
            echo "regex=($hashes)" >> "$GITHUB_OUTPUT"
          fi

      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          name: viluon
          pushFilter: ${{ steps.push-filter.outputs.regex }}

      - name: build system
        env:
          TARGET: "github:${{ github.repository }}/${{ github.ref }}#${{ env.output }}"
        run: nix build $TARGET --fallback --log-format raw --print-build-logs --out-link head

      - name: garbage-collect build dependencies
        run: nix-collect-garbage

      - name: fetch old system
        id: base
        continue-on-error: true
        env:
          TARGET: "github:${{ github.repository }}/${{ github.base_ref }}#${{ env.output }}"
        run: nix build $TARGET --log-format raw --print-build-logs --out-link base

      - name: output build failure
        if: failure()
        run: |
          drv=$(grep "For full logs, run" /tmp/nix-build-err.log | grep -oE "/nix/store/.*.drv")
          if [ -n $drv ]; then
            nix log $drv
            echo $drv
          fi
          exit 1

      - name: scan for vulnerabilities
        run: |
          nix run nixpkgs/nixos-unstable#vulnix -- \
            --whitelist https://raw.githubusercontent.com/ckauhaus/nixos-vulnerability-roundup/master/whitelists/nixos-unstable.toml \
            ./head > vulns.txt || [ $? -lt 3 ]

      - name: diff systems
        if: steps.base.outcome == 'success'
        run: nix run nixpkgs/nixos-unstable#nvd -- diff ./base ./head > diff.txt

      - name: write report
        env:
          HOST: ${{ matrix.host }}
          SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary-${{ job.check_run_id }}
        run: |
          vulns=$(sed -nE 's/^([0-9]+) derivations with active advisories$/\1/p' vulns.txt)
          if [ ! -f diff.txt ]; then
            change="no baseline"
          elif grep -q '(0 paths added, 0 paths removed,' diff.txt; then
            change="unchanged"
          else
            change=$(sed -nE 's/^Closure size: .*delta ([^,]+), disk usage ([^)]+)\)\.$/delta \1, \2/p' diff.txt)
          fi

          mkdir report
          {
            echo "<details><summary><code>$HOST</code>: $change, <a href=\"$SUMMARY_URL\">${vulns:-0} vulns</a></summary>"
            if [ "$change" != unchanged ] && [ -f diff.txt ]; then
              echo
              echo '```'
              cat diff.txt
              echo '```'
            fi
            echo "</details>"
          } > "report/$HOST.md"

          {
            echo "### $HOST"
            echo '```'
            cat vulns.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload report
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.host }}
          path: report/

  comment:
    needs: [hosts, build]
    if: ${{ !cancelled() && needs.hosts.result == 'success' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-26.04
    concurrency:
      group: pr-${{ github.event.pull_request.number }}-comment
      cancel-in-progress: true
    steps:
      - name: download reports
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: assemble comment
        env:
          HOSTS: ${{ needs.hosts.outputs.hosts }}
        run: |
          for host in $(jq -r '.[]' <<< "$HOSTS"); do
            if [ -f "reports/$host.md" ]; then
              cat "reports/$host.md"
            else
              echo "<details><summary><code>$host</code>: failed</summary></details>"
            fi
          done > comment.md

      - name: comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: systems
          path: comment.md
