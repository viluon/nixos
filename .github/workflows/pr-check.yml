# see https://github.com/EdenEast/nyx/blob/718063918f0ffe36ca1e049b222d5a5d3e939025/.github/workflows/pr.yml

name: pr

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  hosts:
    runs-on: ubuntu-26.04
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}

      - name: list hosts
        id: list
        env:
          FLAKE: "github:${{ github.repository }}/${{ github.ref }}"
        run: |
          systems=$(nix eval --json "$FLAKE#nixosConfigurations" --apply 'builtins.mapAttrs (_: host: host.pkgs.stdenv.hostPlatform.system)')
          packages=$(nix eval --json "$FLAKE#packages" --apply 'builtins.mapAttrs (_: builtins.attrNames)')
          hosts=$(jq --compact-output --argjson packages "$packages" '
            {"x86_64-linux": "ubuntu-26.04", "aarch64-linux": "ubuntu-26.04-arm"} as $runners
            | to_entries
            | map(.key as $host | .value as $system | {
                host: $host,
                os: ($runners[$system] // error("no runner for \($system)")),
                image: (if $packages[$system] | any(. == $host) then "packages.\($system).\($host)" else null end)
              })' <<< "$systems")
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  build:
    needs: hosts
    name: build/${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: pr-${{ github.event.pull_request.number }}-${{ matrix.host }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    env:
      output: nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
    steps:
      - name: create nix mount point
        run: sudo mkdir /nix

      - name: maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /nix
          overprovision-lvm: true
          remove-android: true
          remove-codeql: true
          remove-docker-images: true
          remove-dotnet: true
          remove-haskell: true
          root-reserve-mb: 512
          swap-size-mb: 1024

      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}

      - name: compute push filter
        id: push-filter
        env:
          HEAD_TARGET: "github:${{ github.repository }}/${{ github.ref }}#${{ env.output }}"
          BASE_TARGET: "github:${{ github.repository }}/${{ github.base_ref }}#${{ env.output }}"
        run: |
          head_drv=$(nix eval --raw "$HEAD_TARGET.drvPath")
          base_drv=$(nix eval --raw "$BASE_TARGET.drvPath" || true)
          intellij_drvs=$(nix-store --query --requisites $head_drv $base_drv | grep -E -- '-intellij-idea-[0-9.]+\.drv$' || true)
          if [ -n "$intellij_drvs" ]; then
            uncached_drvs=$( { nix-store --query --referrers-closure $intellij_drvs; nix-store --query --references $intellij_drvs; } | grep '\.drv$' | sort -u)
            hashes=$(nix-store --query --outputs $uncached_drvs | sed -E 's|^/nix/store/([a-z0-9]{32})-.*|\1|' | paste -sd'|')
            echo "regex=($hashes)" >> "$GITHUB_OUTPUT"
          fi

      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          name: viluon
          pushFilter: ${{ steps.push-filter.outputs.regex }}

      - name: build system
        env:
          TARGET: "github:${{ github.repository }}/${{ github.ref }}#${{ env.output }}"
        run: nix build $TARGET --fallback --log-format raw --print-build-logs

      - name: build image
        if: matrix.image
        env:
          TARGET: "github:${{ github.repository }}/${{ github.ref }}#${{ matrix.image }}"
        run: nix build $TARGET --fallback --log-format raw --print-build-logs --out-link image

      - name: garbage-collect build dependencies
        run: nix-collect-garbage

      - name: fetch old system to profile
        continue-on-error: true
        env:
          TARGET: "github:${{ github.repository }}/${{ github.base_ref }}#${{ env.output }}"
        run: nix build $TARGET --log-format raw --print-build-logs --profile ./profile

      - name: add new system to profile
        env:
          TARGET: "github:${{ github.repository }}/${{ github.ref }}#${{ env.output }}"
        run: nix build $TARGET --log-format raw --print-build-logs --profile ./profile

      - name: output build failure
        if: failure()
        run: |
          drv=$(grep "For full logs, run" /tmp/nix-build-err.log | grep -oE "/nix/store/.*.drv")
          if [ -n $drv ]; then
            nix log $drv
            echo $drv
          fi
          exit 1

      - name: Scan for security issues
        id: security
        run: | # https://stackoverflow.com/a/74232400
          nix run nixpkgs/nixos-unstable#vulnix -- \
            --whitelist https://raw.githubusercontent.com/ckauhaus/nixos-vulnerability-roundup/master/whitelists/nixos-unstable.toml \
            ./profile \
            | tee /tmp/security.txt

          delimiter="$(openssl rand -hex 16)"
          echo "security<<${delimiter}" >> "${GITHUB_OUTPUT}"
          cat /tmp/security.txt >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

          # if the report has more than 3 lines
          if [ $(wc -l < /tmp/security.txt) -gt 3 ]; then
            echo "icon=:warning:" >> "${GITHUB_OUTPUT}"
          else
            echo "icon=:white_check_mark:" >> "${GITHUB_OUTPUT}"
          fi

      - name: diff profile
        id: diff
        run: |
          delimiter="$(openssl rand -hex 16)"
          echo "diff<<${delimiter}" >> "${GITHUB_OUTPUT}"
          nix run nixpkgs/nixos-unstable#nvd -- history --profile ./profile >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

      - name: prepare comment
        run: |
          cat <<'EOF' > ./comment.md
            ### Diff of `${{ env.output }}`

            ```
            ${{ steps.diff.outputs.diff }}
            ```

            <details>
            <summary> ${{ steps.security.outputs.icon }} Security vulnerability report </summary> <br>
            <pre> ${{ steps.security.outputs.security }} </pre>
            </details>
          EOF

      - name: comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ".#${{ matrix.host }}"
          path: ./comment.md
