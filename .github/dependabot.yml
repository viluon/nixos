version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns:
          - '*'
    schedule:
      interval: daily
  - package-ecosystem: npm
    directories:
      - /denix/modules/desktop/niri/vicinae-extensions/*/
    groups:
      npm:
        patterns:
          - '*'
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directories:
      - /packages/secretctl
      - /packages/starship-pr-ci
    groups:
      cargo:
        patterns:
          - '*'
    schedule:
      interval: daily
